<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Codificación de caracteres y título de la página -->
  <meta charset="utf-8">
  <title>Blog Post Card</title>
  
  <!-- Vinculación de la hoja de estilos externa -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Contenedor principal de la tarjeta de publicación -->
  <div class="blog-post-card">
    
    <!-- Imagen de portada de la publicación con su respectivo texto alternativo -->
    <img 
      class="post-img" 
      src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" 
      alt="Persona trabajando en desarrollo web con una laptop"
    >

    <!-- Contenedor para el contenido de texto de la tarjeta -->
    <div class="post-content">
      
      <!-- Título principal del post -->
      <h2 class="post-title">Aprende Desarrollo Web</h2>
      
      <!-- Extracto o resumen corto de la publicación -->
      <p class="post-excerpt">
        Descubre las tendencias más recientes en desarrollo web, desde HTML5 y CSS3 hasta las mejores prácticas de maquetación y diseño adaptable.
      </p>
      
      <!-- Enlace con estilo de botón para leer el artículo completo -->
      <a class="read-more" href="#">Read More</a>
      
    </div>

  </div>

</body>
</html>
